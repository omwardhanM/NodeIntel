<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Looksmax</title>
  <!-- Modern minimalist typography via Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000000;
      --text-primary: #ffffff;
      --border-color: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      /* Rigorously remove the blue flash when tapping on mobile */
      -webkit-tap-highlight-color: transparent;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      outline: none;
    }

    body {
      background-color: var(--bg-color);
      /* Very subtle radial gradient to create depth without violating minimalism */
      background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000000 80%);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

      /* Prevent text selection for a native app feel */
      -webkit-user-select: none;
      user-select: none;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 24px;
      z-index: 10;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 4rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      color: rgba(255, 255, 255, 0.9);
    }

    p.subtitle {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      max-width: 250px;
      line-height: 1.4;
    }

    #btn-connect {
      appearance: none;
      -webkit-appearance: none;
      /* Subtle glassmorphism effect */
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 20px 0;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
      border-radius: 2px;
      /* Smooth micro-animation for state changes */
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

      /* Explicitly kill tap highlights for buttons */
      -webkit-tap-highlight-color: transparent;
    }

    #btn-connect:active {
      background: rgba(255, 255, 255, 0.9);
      color: #000;
      transform: scale(0.97);
      /* Micro-interaction feedback */
      border-color: rgba(255, 255, 255, 0.9);
    }

    #btn-connect:focus-visible {
      outline: 2px solid var(--text-primary);
      outline-offset: 4px;
    }

    .footer-note {
      position: absolute;
      bottom: 2rem;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <main>
    <div class="brand-container">
      <h1>Looksmax</h1>
      <p class="subtitle">Real-time facial aesthetic analysis</p>
    </div>

    <button id="btn-connect">Connect</button>
  </main>

  <div class="footer-note">Developed by Omwardhan Mishra</div>

  <!-- Required Hidden Elements -->
  <video id="video-preview" autoplay playsinline muted style="display: none;"></video>
  <audio id="incoming-audio" autoplay playsinline
    style="position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none;"></audio>

  <!-- Required Script Tag -->
  <script type="module" src="/js/client/client.js"></script>

</body>

</html>
